name: Gerar APK Agrogauer v2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Criar Projeto Estrutural
        run: |
          flutter create --org com.agrogauer --project-name agrogauer .
          
      - name: Injetar Interface Dark Mode e Regras de Acesso
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const AgrogauerApp());
          }

          class AgrogauerApp extends StatelessWidget {
            const AgrogauerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Agrogauer',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  primaryColor: const Color(0xFF10B981),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF10B981),
                    secondary: Color(0xFF059669),
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const LoginPage(),
              );
            }
          }

          class LoginPage extends StatefulWidget {
            const LoginPage({super.key});

            @override
            State<LoginPage> createState() => _LoginPageState();
          }

          class _LoginPageState extends State<LoginPage> {
            bool isMestreSelected = true;
            final _userController = TextEditingController(text: 'mestre');
            final _passwordController = TextEditingController();

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 24.0),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        Row(
                          children: [
                            Container(
                              padding: const EdgeInsets.all(8),
                              decoration: BoxDecoration(
                                color: const Color(0xFF10B981),
                                borderRadius: BorderRadius.circular(12),
                              ),
                              child: const Icon(Icons.agriculture, color: Colors.black, size: 32),
                            ),
                            const SizedBox(width: 12),
                            const Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text('AGROGAUER', style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, letterSpacing: 1.5)),
                                Text('CENTRO DE COMANDO', style: TextStyle(fontSize: 10, color: Colors.grey, letterSpacing: 1)),
                              ],
                            )
                          ],
                        ),
                        const SizedBox(height: 24),
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                          decoration: BoxDecoration(
                            color: const Color(0xFF1E1E1E),
                            borderRadius: BorderRadius.circular(12),
                          ),
                          child: const Row(
                            children: [
                              Icon(Icons.circle, color: Color(0xFF10B981), size: 12),
                              SizedBox(width: 10),
                              Text('Nó Mestre disponível', style: TextStyle(fontSize: 14)),
                              Spacer(),
                              Text('ONLINE', style: TextStyle(color: Color(0xFF10B981), fontWeight: FontWeight.bold, fontSize: 12)),
                            ],
                          ),
                        ),
                        const SizedBox(height: 40),
                        const Text('Acesso seguro', style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 8),
                        const Text('Entre para acompanhar o estoque, os operadores e as aprovações em tempo real.', style: TextStyle(color: Colors.grey)),
                        const SizedBox(height: 24),
                        Row(
                          children: [
                            Expanded(
                              child: ElevatedButton.icon(
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: isMestreSelected ? const Color(0xFF064E3B) : const Color(0xFF1E1E1E),
                                  foregroundColor: isMestreSelected ? const Color(0xFF10B981) : Colors.white,
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8)),
                                  padding: const EdgeInsets.symmetric(vertical: 14),
                                ),
                                icon: const Icon(Icons.shield_outlined, size: 18),
                                label: const Text('Mestre'),
                                onPressed: () => setState(() {
                                  isMestreSelected = true;
                                  _userController.text = 'mestre';
                                }),
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: ElevatedButton.icon(
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: !isMestreSelected ? const Color(0xFF064E3B) : const Color(0xFF1E1E1E),
                                  foregroundColor: !isMestreSelected ? const Color(0xFF10B981) : Colors.white,
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(8)),
                                  padding: const EdgeInsets.symmetric(vertical: 14),
                                ),
                                icon: const Icon(Icons.person_outline, size: 18),
                                label: const Text('Operador'),
                                onPressed: () => setState(() {
                                  isMestreSelected = false;
                                  _userController.text = 'operador_teste';
                                }),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 24),
                        const Text('Nome de usuário', style: TextStyle(fontSize: 14, fontWeight: FontWeight.w500)),
                        const SizedBox(height: 6),
                        TextField(
                          controller: _userController,
                          decoration: InputDecoration(
                            hintText: 'ex.: mestre',
                            fillColor: const Color(0xFF1E1E1E),
                            filled: true,
                            border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                          ),
                        ),
                        const SizedBox(height: 16),
                        const Text('Senha', style: TextStyle(fontSize: 14, fontWeight: FontWeight.w500)),
                        const SizedBox(height: 6),
                        TextField(
                          controller: _passwordController,
                          obscureText: true,
                          decoration: InputDecoration(
                            hintText: 'Digite sua senha',
                            fillColor: const Color(0xFF1E1E1E),
                            filled: true,
                            border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                          ),
                        ),
                        const SizedBox(height: 24),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(
                            backgroundColor: const Color(0xFF10B981),
                            foregroundColor: Colors.black,
                            padding: const EdgeInsets.symmetric(vertical: 16),
                            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24)),
                          ),
                          onPressed: () {
                            Navigator.pushReplacement(
                              context,
                              MaterialPageRoute(builder: (context) => MainNavigationHub(isMestre: isMestreSelected)),
                            );
                          },
                          child: const Text('Entrar no comando', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                        ),
                        const SizedBox(height: 16),
                        TextButton(
                          onPressed: () {},
